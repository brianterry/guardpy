name: Release Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels with maturin
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.16.0"
          command: build
          args: --release --out wheelhouse
          manylinux: "2014"

      - name: Audit stable ABI
        shell: bash
        run: |
          python -m pip install abi3audit==0.0.26
          abi3audit --strict wheelhouse/*.whl

      - name: Build source distribution
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.16.0"
          command: sdist
          args: --out wheelhouse

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install wheel
        shell: bash
        run: python -m pip install --no-index --no-deps wheelhouse/*.whl

      - name: Test installed wheel
        run: python -X faulthandler -m unittest discover -s tests -p 'test_wheel.py' -v

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_USERNAME: __token__
          MATURIN_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: "1.16.0"
          command: upload
          args: --non-interactive wheelhouse/*
